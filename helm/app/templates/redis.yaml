apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image:  {{ .Values.images.redis }}
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
