apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sql-pvc
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: "hostpath"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql
  template:
    metadata:
      labels:
        app: sql
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ .Values.serviceAccounts.sql }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
      - name: mssql-linux
        image: {{ .Values.images.sql }}
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sql-secret
              key: SA_PASSWORD
        - name: MSSQL_PID
          value: "Express"
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql
      volumes:
      - name: mssql-data
        persistentVolumeClaim:
          claimName: sql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sql
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: sql
  ports:
  - port: 1433
    targetPort: 1433
    protocol: TCP
    name: mssql
